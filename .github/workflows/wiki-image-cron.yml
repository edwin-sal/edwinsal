name: Refresh image of the day

on:
  schedule:
    # 22:00 UTC = 06:00 Asia/Manila (UTC+8, no DST)
    - cron: '0 22 * * *'
  workflow_dispatch: {}

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger wiki-image cron endpoint
        run: |
          curl -sf -X GET \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            https://edwinsal.vercel.app/api/cron/wiki-image
