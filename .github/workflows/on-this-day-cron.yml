name: Refresh on this day

on:
  schedule:
    - cron: '0 22 * * *'
  workflow_dispatch: {}

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger on-this-day cron endpoint
        run: |
          curl -sf -X GET \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            https://edwinsal.vercel.app/api/cron/on-this-day
